aid: palmstreet
name: Palmstreet
description: 'Palmstreet is a live shopping marketplace where sellers host interactive
  live-stream sales and buyers browse more than a million listings across rare plants,
  handmade goods, vintage items, jewelry, crystals, coins, fashion, beauty, aquatics,
  reptiles, and designer toys. The platform pairs real-time video commerce with a
  traditional marketplace, free seller onboarding, and Seller Hub inventory tooling.
  Backed by Craft Ventures, Palmstreet operates as a consumer mobile app (iOS/Android)
  and web storefront. No public developer API, documentation portal, or partner API
  surface is published as of this enrichment pass; this profile captures the company
  identity and public web properties only.'
